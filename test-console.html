<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Console - Cronologia Bíblica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        .test-btn:hover {
            background: #0056b3;
        }
        .error-btn { background: #dc3545; }
        .warn-btn { background: #ffc107; color: #000; }
        .info-btn { background: #17a2b8; }
    </style>
</head>
<body>
    <h1>🧪 Teste de Console - Sistema de Debugging</h1>
    <p>Use estes botões para testar diferentes tipos de log que devem aparecer no monitor de console da aplicação principal:</p>
    
    <div>
        <button class="test-btn error-btn" onclick="testError()">🔴 Gerar Erro</button>
        <button class="test-btn warn-btn" onclick="testWarning()">🟡 Gerar Warning</button>
        <button class="test-btn info-btn" onclick="testInfo()">🔵 Gerar Info</button>
        <button class="test-btn" onclick="testLog()">⚪ Gerar Log</button>
        <button class="test-btn error-btn" onclick="testUnhandledError()">💥 Erro Não Tratado</button>
        <button class="test-btn error-btn" onclick="testPromiseRejection()">🚫 Promise Rejeitada</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Status:</h3>
        <div id="status">Aguardando testes...</div>
    </div>

    <script>
        function updateStatus(message) {
            document.getElementById('status').innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
        }

        function testError() {
            console.error('🧪 TESTE DE ERRO: Este é um erro de teste gerado propositalmente');
            updateStatus('❌ Erro enviado para console');
        }

        function testWarning() {
            console.warn('🧪 TESTE DE WARNING: Este é um aviso de teste');
            updateStatus('⚠️ Warning enviado para console');
        }

        function testInfo() {
            console.info('🧪 TESTE DE INFO: Esta é uma informação de teste');
            updateStatus('ℹ️ Info enviado para console');
        }

        function testLog() {
            console.log('🧪 TESTE DE LOG: Este é um log normal de teste');
            updateStatus('📝 Log enviado para console');
        }

        function testUnhandledError() {
            // Simular erro não tratado
            setTimeout(() => {
                throw new Error('🧪 TESTE: Erro não tratado simulado');
            }, 100);
            updateStatus('💥 Erro não tratado disparado');
        }

        function testPromiseRejection() {
            // Simular promise rejeitada
            Promise.reject('🧪 TESTE: Promise rejeitada simulada').catch(() => {
                // Não tratar para gerar unhandled rejection
            });
            
            // E uma sem catch para garantir que seja realmente não tratada
            setTimeout(() => {
                Promise.reject('🧪 TESTE: Promise realmente não tratada');
            }, 50);
            
            updateStatus('🚫 Promise rejeitada disparada');
        }

        // Gerar alguns logs iniciais
        console.log('🚀 Página de teste carregada - Sistema de debug deve capturar isso');
        updateStatus('✅ Página de teste carregada');
    </script>
</body>
</html>
